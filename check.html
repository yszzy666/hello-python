<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交作业核对器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
  background:#0f172a;color:#e2e8f0;min-height:100vh;
  display:flex;justify-content:center;padding:32px 16px;
}
.wrap{width:100%;max-width:760px}
h1{font-size:22px;font-weight:600;text-align:center}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin:8px 0 28px;line-height:1.7}
.drop{
  border:2px dashed #334155;border-radius:16px;padding:56px 24px;
  text-align:center;cursor:pointer;transition:.2s;
}
.drop:hover,.drop.over{border-color:#38bdf8;background:rgba(56,189,248,.06)}
.drop .big{font-size:34px;margin-bottom:12px}
.drop p{color:#94a3b8;font-size:14px;line-height:1.9}
.drop strong{color:#38bdf8}
.picker{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;background:#1e293b;border-radius:12px;padding:16px}
.picker .col{flex:1;min-width:200px}
.picker label{font-size:13px;color:#94a3b8;display:block;margin-bottom:6px}
.picker select{
  width:100%;padding:8px 10px;border-radius:8px;border:1px solid #334155;
  background:#0f172a;color:#e2e8f0;font-size:14px;
}
.card{background:#1e293b;border-radius:14px;padding:18px 20px;margin-top:16px}
.card h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card .n{font-size:13px;color:#94a3b8;font-weight:400}
.card p{font-size:14px;line-height:2;color:#cbd5e1;word-break:break-all}
.ok h2{color:#4ade80}
.no h2{color:#f87171}
.unk h2{color:#fbbf24}
.tag{display:inline-block;background:#0f172a;border-radius:6px;padding:1px 8px;font-size:13px;color:#fbbf24;margin-left:6px}
.btn{
  display:inline-block;margin-top:12px;padding:8px 16px;border-radius:8px;
  border:1px solid #334155;background:#0f172a;color:#94a3b8;font-size:13px;cursor:pointer;
}
.btn:hover{border-color:#38bdf8;color:#38bdf8}
.footer{text-align:center;color:#475569;font-size:12px;margin-top:28px;line-height:1.8}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>交作业核对器 <span style="font-size:13px;color:#64748b;font-weight:400">v2</span></h1>
  <p class="sub">把一个 Excel 拖进来，自动分出「交了 / 没交 / 特殊情况」</p>

  <div class="drop" id="drop">
    <div class="big">📂</div>
    <p><strong>点击选择文件</strong>，或把 .xlsx / .xls / .csv 拖到这里</p>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hide">
  </div>

  <div class="picker hide" id="picker">
    <div class="col">
      <label>哪一列是姓名</label>
      <select id="nameSel"></select>
    </div>
    <div class="col">
      <label>哪一列是提交状态</label>
      <select id="statusSel"></select>
    </div>
  </div>

  <div id="out"></div>

  <p class="footer">数据只在你自己的浏览器里处理，不会上传到任何服务器</p>
</div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'"></script>
<script>
// ===== 认可哪些写法算「交了」（认不全就往里加）=====
var 交了词 = ["是","已交","交了","交","已提交","提交","完成","ok","yes","y","1","true","√","✓","到","到了"];
// ===== 认可哪些写法算「没交」=====
var 没交词 = ["否","没交","未交","未提交","未","没","no","n","0","false","×","✗","x"];
// ===== 哪些行是汇总行，不当人算 =====
var 汇总词 = /^(合计|总计|小计|总数|共计|合\s*计)/;

var 表头 = [], 数据行 = [];

var drop = document.getElementById('drop');
var fileInput = document.getElementById('file');
var picker = document.getElementById('picker');
var nameSel = document.getElementById('nameSel');
var statusSel = document.getElementById('statusSel');
var out = document.getElementById('out');

drop.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(e){ if (e.target.files[0]) 读文件(e.target.files[0]); });

['dragenter','dragover'].forEach(function(t){
  drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.add('over'); });
});
['dragleave','drop'].forEach(function(t){
  drop.addEventListener(t, function(e){ e.preventDefault(); drop.classList.remove('over'); });
});
drop.addEventListener('drop', function(e){
  if (e.dataTransfer.files[0]) 读文件(e.dataTransfer.files[0]);
});

// ===== 找表头行 =====
// 表头经常不在第 1 行：上面可能有"高一(3)班 语文作业提交情况"这种标题，
// 也可能整行是空的（合并单元格的标题行只有 1 个格子有字）。
// 所以不猜"第几行"，改成给前 10 行打分：非空格子越多越像表头，带"姓名"字样再加 20 分。
function 找表头行(rows){
  var 线索 = ["姓名","名字","学生","name"];
  var 上限 = Math.min(rows.length, 10);
  var 最佳 = -1, 最佳分 = -1;
  for (var i = 0; i < 上限; i++){
    var 行 = rows[i] || [];
    var 非空 = 0, 文字 = [];
    for (var k = 0; k < 行.length; k++){
      var v = 行[k];
      if (v !== null && v !== undefined && String(v).trim() !== ''){
        非空++;
        文字.push(String(v).toLowerCase());
      }
    }
    if (非空 < 2) continue;          // 只有 1 个格子的，是标题不是表头
    var 有线索 = 0, 合起来 = 文字.join('|');
    for (var j = 0; j < 线索.length; j++){
      if (合起来.indexOf(线索[j]) >= 0){ 有线索 = 1; break; }
    }
    var 分 = 非空 + 有线索 * 20;
    if (分 > 最佳分){ 最佳分 = 分; 最佳 = i; }
  }
  return 最佳 >= 0 ? 最佳 : 0;
}

function 读文件(file){
  if (typeof XLSX === 'undefined'){
    out.innerHTML = '<div class="card"><h2 style="color:#f87171">表格解析库没加载出来</h2><p>你的网络可能连不上 CDN。换个网络（比如手机热点）刷新试试。</p></div>';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      if (rows.length < 2){
        out.innerHTML = '<div class="card"><p>这个表里没有数据行。</p></div>';
        return;
      }
      var 头 = 找表头行(rows);
      表头 = (rows[头] || []).map(function(h){ return String(h).trim(); });
      数据行 = rows.slice(头 + 1);
      填选项();
      算结果();
    } catch(err){
      out.innerHTML = '<div class="card"><h2 style="color:#f87171">读不出来</h2><p>' + err.message + '</p></div>';
    }
  };
  reader.readAsArrayBuffer(file);
}

function 猜列(关键字){
  for (var i=0;i<表头.length;i++){
    for (var j=0;j<关键字.length;j++){
      if (表头[i].indexOf(关键字[j]) >= 0) return i;
    }
  }
  return -1;
}

function 填选项(){
  var 名字列 = 猜列(['姓名','名字','学生','name','Name']);
  var 状态列 = 猜列(['是否提交','提交','状态','交作业','完成']);
  [nameSel, statusSel].forEach(function(sel){
    sel.innerHTML = '';
    表头.forEach(function(h, i){
      var o = document.createElement('option');
      o.value = i;
      o.textContent = h || ('第' + (i+1) + '列');
      sel.appendChild(o);
    });
  });
  nameSel.value = 名字列 >= 0 ? 名字列 : 0;
  statusSel.value = 状态列 >= 0 ? 状态列 : Math.min(1, 表头.length-1);
  picker.classList.remove('hide');
}

nameSel.addEventListener('change', 算结果);
statusSel.addEventListener('change', 算结果);

function 算结果(){
  var ni = parseInt(nameSel.value, 10);
  var si = parseInt(statusSel.value, 10);
  var 交了 = [], 没交 = [], 看不懂 = [], 跳过 = [];

  for (var r=0;r<数据行.length;r++){
    var row = 数据行[r];
    var 姓名 = String(row[ni] === undefined || row[ni] === null ? '' : row[ni]).trim();
    if (!姓名) continue;
    if (汇总词.test(姓名)){ 跳过.push(姓名); continue; }
    var 原值 = String(row[si] === undefined || row[si] === null ? '' : row[si]).trim();
    var 值 = 原值.toLowerCase().replace(/\s/g, '');
    if (交了词.indexOf(值) >= 0) 交了.push(姓名);
    else if (没交词.indexOf(值) >= 0) 没交.push(姓名);
    else 看不懂.push({姓名: 姓名, 原值: 原值 === '' ? '（空）' : 原值});
  }

  var html = '';
  html += '<div class="card ok"><h2>✅ 已交<span class="n">' + 交了.length + ' 人</span></h2><p>' + (交了.join('、') || '—') + '</p></div>';
  html += '<div class="card no"><h2>❌ 没交<span class="n">' + 没交.length + ' 人</span></h2><p>' + (没交.join('、') || '—') + '</p>';
  if (没交.length) html += '<button class="btn" id="copyBtn">复制没交名单</button>';
  html += '</div>';

  if (看不懂.length){
    html += '<div class="card unk"><h2>⚠️ 特殊情况<span class="n">' + 看不懂.length + ' 人</span></h2><p>';
    html += 看不懂.map(function(x){ return x.姓名 + '<span class="tag">' + x.原值 + '</span>'; }).join('<br>');
    html += '</p><p style="margin-top:10px;color:#94a3b8;font-size:13px">这些人需要你自己确认一下算不算交了。</p></div>';
  }

  html += '<div class="card"><h2 style="color:#94a3b8">合计<span class="n">' + (交了.length + 没交.length + 看不懂.length) + ' 人</span></h2>';
  if (跳过.length){
    html += '<p style="color:#64748b;font-size:13px;margin-top:6px">已跳过汇总行：' + 跳过.join('、') + '（不当作学生）</p>';
  }
  html += '</div>';

  out.innerHTML = html;

  var copyBtn = document.getElementById('copyBtn');
  if (copyBtn) copyBtn.addEventListener('click', function(){
    var text = '还没交作业（' + 没交.length + '人）：' + 没交.join('、');
    复制(text, copyBtn);
  });
}

function 复制(text, btn){
  var done = function(){
    btn.textContent = '已复制 ✓';
    setTimeout(function(){ btn.textContent = '复制没交名单'; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(function(){ 老办法(text, done); });
  } else {
    老办法(text, done);
  }
}

function 老办法(text, done){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e) { alert('复制失败，请手动选中'); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
