<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下一节课倒计时</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .now { font-size: 15px; color: #94a3b8; margin-bottom: 20px; }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
    }
    .label { font-size: 13px; color: #64748b; letter-spacing: 2px; margin-bottom: 12px; }
    .course { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .place { font-size: 15px; color: #94a3b8; margin-bottom: 28px; min-height: 22px; }
    .time { font-size: 44px; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>

  <div class="now" id="now">现在： --</div>

  <div class="card">
    <div class="label">下一节课</div>
    <div class="course" id="course">--</div>
    <div class="place" id="place">--</div>
    <div class="time" id="time">--</div>
  </div>

  <script>
    courses = [
    ("软件工程专业导论", "寒武 204", 8, 0),
    ("高等数学", "2教 418", 10, 0),
    ("思想道德与法治", "2教 507", 14, 0),
    ("C语音程序设计理论课", "图书馆 610-2", 16, 0),
    ("C语音程序设计实验课","图书馆 610-2", 19, 0)
]

    function update() {
      const now = new Date();
      document.getElementById("now").textContent =
        "现在： " + now.getHours() + " 点 " + now.getMinutes() + " 分";

      let next = null;
      for (const course of courses) {
        const classTime = new Date();
        classTime.setHours(course.hour, course.minute, 0, 0);
        if (classTime > now) {
          next = { course: course, time: classTime };
          break;
        }
      }

      const courseEl = document.getElementById("course");
      const placeEl = document.getElementById("place");
      const timeEl = document.getElementById("time");

      if (next === null) {
        courseEl.textContent = "今天的课都上完了";
        placeEl.textContent = "";
        timeEl.textContent = "🎉";
      } else {
        courseEl.textContent = next.course.name;
        placeEl.textContent = next.course.place;
        const diff = Math.floor((next.time - now) / 1000);
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        timeEl.textContent = h + " 小时 " + m + " 分 " + s + " 秒";
      }
    }

    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
